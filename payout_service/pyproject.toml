[project]
name = "payouts"
version = "1.0.0"
description = "REST-сервис для управления заявками на выплату средств"
authors = [
    {name = "stanislawe"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (==4.2)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "celery[redis] (>=5.6.0,<6.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "eventlet (>=0.40.4,<0.41.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.11.0,<26.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=38.2.0,<39.0.0)"
]
